[package]
# Underscore, unlike the other crates: cxx-qt-cmake 0.10 exports headers under
# Corrosion's target name (always with underscores) while cxx-qt-build uses
# the Cargo package name; they only agree without hyphens.
name = "ferny_bridge"
description = "cxx-qt bridge exposing the Rust core to the Qt UI. The only crate allowed to use unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Imported by CMake through Corrosion / cxx-qt-cmake and linked into the app.
[lib]
crate-type = ["staticlib"]

[dependencies]
ferny-build.workspace = true
ferny-core.workspace = true
ferny-config.workspace = true
ferny-lsp.workspace = true
ferny-plugin.workspace = true
serde_json.workspace = true
ferny-syntax.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

# The bridge hosts FFI generated by cxx-qt, so it cannot forbid unsafe code.
# Every unsafe block must carry a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
