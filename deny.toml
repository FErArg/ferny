# cargo-deny policy for Ferny (cargo-deny 0.20). Run: cargo deny check
# Part of the validation gate (scripts/check.*) and threat T14 (supply chain).
# Every exception needs a reason and an entry in docs/DEPENDENCIES.md; long-
# lived ones also need a security exception (see SECURITY.md).

[graph]
# Tier-1 targets (docs/DESIGN.md §8).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerabilities, unmaintained and unsound crates fail by default.
# Yanked crates fail too.
yanked = "deny"
ignore = []

[licenses]
# Licences compatible with distributing Ferny under GPL-2.0-or-later
# (Apache-2.0 and LGPL-3.0 make binaries effectively GPL-3.0; DESIGN §11).
allow = [
    "GPL-2.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Not every allowed licence is in use yet.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
# No wildcard version requirements (`*`) in our own manifests.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only; any git or other registry dependency must be added here
# explicitly, with a reason.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
