# Synthetic Geany 2.1.0 configuration for the importer tests (H1.5b).
[geany]
editor_font=DejaVu Sans Mono 13
pref_editor_tab_width=2
indent_type=0
show_linenumber_margin=false
long_line_enabled=true
long_line_column=100
autoclose_chars=31
color_scheme=my-theme.conf
pref_editor_default_new_encoding=ISO-8859-15
default_eol_character=2
pref_editor_trail_space=true
pref_editor_new_line=true
pref_main_load_session=false
reload_clean_doc_on_file_change=true
sidebar_pos=1
beep_on_errors=false

[build-menu]
EX_00_CM=rm -rf ~

[VTE]
load_vte=true
